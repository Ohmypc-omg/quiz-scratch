<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scratch Quiz Time</title>
<style>
:root{--blue:#3478f6;--blue2:#5aa8ff;--purple:#7657f5;--orange:#ffae1b;--ink:#17234c;--muted:#65708e;--paper:#fff;--bg:#edf6ff;--green:#20a66a;--red:#e84c62}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 10%,#d9eaff,transparent 32%),radial-gradient(circle at 90% 90%,#e4dcff,transparent 30%),var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.app{width:min(100%,780px);min-height:520px;background:rgba(255,255,255,.94);border:1px solid #d9e7ff;border-radius:28px;box-shadow:0 20px 60px #274b8a20;overflow:hidden;position:relative}
.topbar{height:10px;background:linear-gradient(90deg,var(--blue),var(--purple),var(--orange))}
.screen{display:none;padding:clamp(22px,5vw,42px)}.screen.active{display:block}
.hero{text-align:center;background:linear-gradient(135deg,#397cff,#7358f5);color:white;padding:26px 24px 34px;min-height:510px}
.hero img{width:min(100%,330px);height:245px;object-fit:cover;object-position:top left;border-radius:22px;border:3px solid #ffffff65;box-shadow:0 12px 25px #182e7040}
h1{font-size:clamp(30px,6vw,44px);margin:15px 0 8px;letter-spacing:-1px}
.subtitle{font-size:16px;line-height:1.6;max-width:430px;margin:0 auto 22px;color:#f3f5ff}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:13px 20px;cursor:pointer;transition:transform .15s,filter .15s}
button:hover{transform:translateY(-2px);filter:brightness(1.04)}button:focus-visible{outline:3px solid #ffcf58;outline-offset:3px}
.primary{background:var(--orange);color:#422b00;box-shadow:0 5px 0 #df8710;font-size:18px;padding:15px 32px}
.bluebtn{background:var(--blue);color:white}.lightbtn{background:#edf3ff;color:#34436d}
.quizhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.progresslabel{font-weight:700;color:#56617e}.score{background:#fff2c7;color:#744900;border:1px solid #ffdb72;padding:9px 14px;border-radius:999px;font-weight:800;white-space:nowrap}
.progress{height:9px;background:#e8effc;border-radius:20px;overflow:hidden;margin:-8px 0 25px}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--purple));transition:width .25s}
.question{font-size:clamp(22px,4vw,29px);line-height:1.3;margin:0 0 24px;letter-spacing:-.4px}
.options{display:grid;gap:12px}
.option{width:100%;text-align:left;background:#f6f9ff;border:2px solid #e0e9fa;color:var(--ink);padding:15px 16px;display:flex;align-items:center;gap:13px;line-height:1.35}
.letter{flex:0 0 34px;height:34px;border-radius:10px;background:#e4edff;color:#285ed0;display:grid;place-items:center;font-weight:800}
.option.correct{border-color:var(--green);background:#e9fff4}.option.correct .letter{background:var(--green);color:white}
.option.wrong{border-color:var(--red);background:#fff0f2}.option.wrong .letter{background:var(--red);color:white}
.option:disabled{cursor:default;transform:none}
.feedback{min-height:28px;margin:16px 0 4px;font-weight:700;line-height:1.4}.feedback.good{color:#138452}.feedback.bad{color:#c6334a}
.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px}.smallnote{font-size:13px;color:var(--muted)}
.result{text-align:center;background:linear-gradient(145deg,#6e55f4,#437df8);color:white;padding:48px 25px;min-height:510px}
.result .trophy{font-size:70px;line-height:1.2}.result h2{font-size:38px;margin:12px 0}.result p{color:#edf0ff;line-height:1.6}
.scorecard{background:white;color:var(--ink);border-radius:22px;padding:22px;margin:24px auto;max-width:340px;box-shadow:0 10px 25px #172c6a30}.finalscore{font-size:48px;font-weight:900;color:var(--purple);margin:6px 0}
.resultbuttons{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.result .primary{box-shadow:0 5px 0 #d88b0a}
@media(max-width:520px){body{padding:10px}.app{border-radius:20px}.hero img{height:210px}.screen{padding:22px}.quizhead{margin-bottom:18px}.question{font-size:23px}.option{padding:12px}.actions{align-items:stretch}.actions button{flex:1}}
</style>
</head>

  <h1>Scratch Quiz Time! ✨</h1>
  <p class="subtitle">Uji pengetahuanmu tentang Scratch lewat 10 soal pilihan ganda. Pilih jawaban yang menurutmu benar dan kumpulkan poin!</p>
  <button class="primary" id="startBtn">▶ Mainkan</button>
</section>

<section class="screen" id="quizScreen">
  <div class="quizhead">
    <div class="progresslabel" id="questionCount">🚩 Soal 1 dari 10</div>
    <div class="score">⭐ Skor: <span id="score">0</span></div>
  </div>
  <div class="progress"><div class="bar" id="progressBar"></div></div>
  <h2 class="question" id="questionText"></h2>
  <div class="options" id="options"></div>
  <div class="feedback" id="feedback" aria-live="polite"></div>
  <div class="actions">
    <span class="smallnote" id="hint">Pilih satu jawaban.</span>
    <button class="bluebtn" id="nextBtn" disabled>Berikutnya →</button>
  </div>
</section>

<section class="screen result" id="resultScreen">
  <div class="trophy" id="resultEmoji">🏆</div>
  <h2 id="resultTitle">Hebat!</h2>
  <p>Kamu sudah menyelesaikan kuis Scratch.</p>
  <div class="scorecard">
    <div>Skor Akhir Kamu</div>
    <div class="finalscore"><span id="finalScore">0</span><span style="font-size:23px;color:#69718a"> / 10</span></div>
    <div id="resultMessage">Terus berlatih, ya!</div>
  </div>
  <div class="resultbuttons">
    <button class="primary" id="restartBtn">↻ Main Lagi</button>
  </div>
</section>
</main>
<script>
const questions = [
 {q:"Apa itu Scratch?",a:["Aplikasi untuk membuat animasi dan game","Aplikasi untuk mengetik dokumen","Aplikasi untuk menghitung angka"],correct:0},
 {q:"Siapa yang membuat Scratch?",a:["Google","MIT Media Lab","Microsoft"],correct:1},
 {q:"Apa fungsi Sprite dalam Scratch?",a:["Sebagai karakter atau objek","Sebagai latar belakang saja","Sebagai tempat menyimpan file"],correct:0},
 {q:"Apa fungsi Stage dalam Scratch?",a:["Tempat menulis kode","Tempat karakter ditampilkan","Tempat menyimpan gambar"],correct:1},
 {q:"Blok “when green flag clicked” berfungsi untuk...",a:["Menghapus karakter","Memulai program","Menghentikan komputer"],correct:1},
 {q:"Apa fungsi blok “move 10 steps”?",a:["Menggerakkan sprite 10 langkah","Mengubah warna sprite","Menghapus sprite"],correct:0},
 {q:"Apa fungsi blok “say Hello!”?",a:["Menggerakkan karakter","Menampilkan teks dari karakter","Mengganti latar belakang"],correct:1},
 {q:"Apa fungsi blok “repeat”?",a:["Mengulang perintah","Menghapus perintah","Mengganti nama sprite"],correct:0},
 {q:"Apa yang dimaksud dengan Backdrop?",a:["Karakter dalam game","Latar belakang Stage","Suara dalam program"],correct:1},
 {q:"Scratch menggunakan sistem pemrograman berupa...",a:["Blok visual","Angka saja","Teks panjang saja"],correct:0}
];
let current=0, score=0, answered=false;
const $=id=>document.getElementById(id);
function showScreen(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));$(id).classList.add("active")}
function startQuiz(){current=0;score=0;$("score").textContent=score;showScreen("quizScreen");renderQuestion()}
function renderQuestion(){
 answered=false;const item=questions[current];
 $("questionCount").textContent=`🚩 Soal ${current+1} dari ${questions.length}`;
 $("progressBar").style.width=`${current/questions.length*100}%`;
 $("questionText").textContent=item.q;$("feedback").textContent="";$("feedback").className="feedback";
 $("hint").textContent="Pilih satu jawaban."; $("nextBtn").disabled=true;
 $("nextBtn").textContent=current===questions.length-1?"Lihat Hasil →":"Berikutnya →";
 const box=$("options");box.innerHTML="";
 item.a.forEach((answer,index)=>{
  const button=document.createElement("button");button.className="option";
  const letter=document.createElement("span");letter.className="letter";letter.textContent=String.fromCharCode(65+index);
  const text=document.createElement("span");text.textContent=answer;
  button.append(letter,text);button.addEventListener("click",()=>chooseAnswer(index));box.appendChild(button);
 });
}
function chooseAnswer(index){
 if(answered)return;answered=true;
 const item=questions[current],buttons=[...$("options").querySelectorAll("button")];
 buttons.forEach((b,i)=>{b.disabled=true;if(i===item.correct)b.classList.add("correct");else if(i===index)b.classList.add("wrong")});
 if(index===item.correct){score++;$("score").textContent=score;$("feedback").textContent="Benar! Hebat, poin kamu bertambah ⭐";$("feedback").classList.add("good")}
 else{$("feedback").textContent="Belum tepat. Jawaban yang benar ditandai warna hijau."; $("feedback").classList.add("bad")}
 $("hint").textContent="Jawaban sudah dipilih."; $("nextBtn").disabled=false;
}
function nextQuestion(){if(!answered)return;if(current<questions.length-1){current++;renderQuestion()}else showResult()}
function showResult(){
 showScreen("resultScreen");$("finalScore").textContent=score;$("progressBar").style.width="100%";
 if(score>=8){$("resultEmoji").textContent="🏆";$("resultTitle").textContent="Luar biasa!";$("resultMessage").textContent="Kamu sudah paham banyak tentang Scratch!"}
 else if(score>=5){$("resultEmoji").textContent="🎉";$("resultTitle").textContent="Bagus!";$("resultMessage").textContent="Sedikit lagi, terus tingkatkan kemampuanmu!"}
 else{$("resultEmoji").textContent="💪";$("resultTitle").textContent="Tetap semangat!";$("resultMessage").textContent="Coba lagi untuk mendapatkan skor lebih tinggi."}
}
$("startBtn").addEventListener("click",startQuiz);$("nextBtn").addEventListener("click",nextQuestion);$("restartBtn").addEventListener("click",startQuiz);
</script>
</body>
</html>
